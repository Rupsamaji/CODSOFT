<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quizly | Interactive Quiz Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#edf1ff,#f8f9fc 55%,#eaf8f4);font-family:"DM Sans",sans-serif;color:#18243a;display:grid;place-items:center;padding:24px}.app{width:min(100%,650px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font:800 24px Manrope;color:#172b50}.brand span{color:#536ff0}.top a{color:#687793;text-decoration:none;font-size:12px}.card{background:white;border:1px solid #e5eaf2;border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 22px 65px #283d6c12}.eyebrow{color:#536ff0;font-size:10px;font-weight:700;letter-spacing:2px}.card h1{font:800 clamp(28px,6vw,38px) Manrope;letter-spacing:-1px;margin:12px 0}.intro{color:#69768d;line-height:1.6;font-size:14px}.start{margin-top:25px;border:0;border-radius:9px;background:#315cf5;color:white;padding:14px 20px;font-weight:700;cursor:pointer}.progress-row{display:flex;justify-content:space-between;color:#78859b;font-size:12px;margin:22px 0 10px}.track{height:7px;background:#edf0f6;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#536ff0;transition:width .2s}.question{font:700 21px/1.4 Manrope;margin:27px 0 18px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:14px 16px;border:1px solid #e1e7f0;border-radius:10px;background:white;color:#34435c;font:600 14px "DM Sans";cursor:pointer}.option:hover:not(:disabled){border-color:#8297f6;background:#f7f8ff}.option.selected{border-color:#536ff0;background:#f0f3ff}.option.correct{border-color:#30b783;background:#edfbf5}.option.wrong{border-color:#e17c87;background:#fff1f2}.next{display:block;margin:22px 0 0 auto;border:0;border-radius:9px;background:#172b50;color:white;padding:13px 20px;font-weight:700;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.feedback{min-height:22px;margin-top:13px;font-size:13px;color:#65738b}.result{text-align:center}.result strong{display:block;font:800 54px Manrope;color:#536ff0;margin:18px}.result p{color:#68768d}.secondary{margin:10px;border:1px solid #dce3ef;background:white;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.hidden{display:none!important}@media(max-width:480px){body{padding:15px}.top{margin-bottom:16px}.card{border-radius:15px}}</style></head>
<body><main class="app"><div class="top"><div class="brand">quiz<span>ly.</span></div><a href="../../">← All projects</a></div><section class="card" id="welcome"><div class="eyebrow">QUICK KNOWLEDGE CHECK</div><h1>Ready to test<br>what you know?</h1><p class="intro">Answer five beginner-friendly web development questions. Choose one option for each question and see your score at the end.</p><button class="start" id="start">Start quiz →</button></section><section class="card hidden" id="quiz"><div class="progress-row"><span id="counter">QUESTION 1 OF 5</span><span id="scoreLive">0 points</span></div><div class="track"><div class="bar" id="bar"></div></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Next question →</button></section><section class="card result hidden" id="result"><div class="eyebrow">QUIZ COMPLETE</div><h1>Your result</h1><strong id="finalScore">0/5</strong><p id="message"></p><button class="start" id="again">Try again ↻</button></section></main><script>const questions=[{q:"What does HTML stand for?",a:["HyperText Markup Language","HighText Machine Language","Hyper Tool Multi Language","Home Tool Markup Language"],correct:0,why:"HTML means HyperText Markup Language. It structures content on web pages."},{q:"Which language is used to style a web page?",a:["Python","CSS","SQL","C"],correct:1,why:"CSS controls the presentation, layout and visual style of web pages."},{q:"Which HTML element is used to link JavaScript?",a:["<css>","<script>","<javascript>","<code>"],correct:1,why:"The script element is used to include or reference JavaScript."},{q:"Which method selects an element by its ID?",a:["getElementById()","queryAll()","selectClass()","getTag()"],correct:0,why:"document.getElementById() finds the element with the matching ID."},{q:"What does responsive design help a website do?",a:["Load without internet","Adapt to different screen sizes","Store passwords","Replace HTML"],correct:1,why:"Responsive design helps layouts adapt to phones, tablets and desktops."}];let current=0;let score=0;let answered=false;const welcome=document.getElementById("welcome"),quiz=document.getElementById("quiz"),result=document.getElementById("result");function showQuestion(){answered=false;const item=questions[current];document.getElementById("counter").textContent="QUESTION "+(current+1)+" OF "+questions.length;document.getElementById("scoreLive").textContent=score+" points";document.getElementById("bar").style.width=(current/questions.length*100)+"%";document.getElementById("question").textContent=item.q;document.getElementById("feedback").textContent="";document.getElementById("next").disabled=true;document.getElementById("next").textContent=current===questions.length-1?"See my result →":"Next question →";const options=document.getElementById("options");options.innerHTML="";item.a.forEach((answer,index)=>{const button=document.createElement("button");button.className="option";button.textContent=String.fromCharCode(65+index)+".  "+answer;button.addEventListener("click",()=>choose(index,button));options.append(button)})}function choose(index,button){if(answered)return;answered=true;const item=questions[current];const buttons=[...document.querySelectorAll(".option")];buttons.forEach((option,i)=>{option.disabled=true;if(i===item.correct)option.classList.add("correct")});if(index===item.correct){score++;button.classList.add("selected");document.getElementById("feedback").textContent="Correct! "+item.why}else{button.classList.add("wrong");document.getElementById("feedback").textContent="Not quite. "+item.why}document.getElementById("scoreLive").textContent=score+" points";document.getElementById("next").disabled=false}function finish(){quiz.classList.add("hidden");result.classList.remove("hidden");document.getElementById("bar").style.width="100%";document.getElementById("finalScore").textContent=score+"/"+questions.length;document.getElementById("message").textContent=score===questions.length?"Perfect score! Excellent work.":score>=3?"Good job! Keep practising and you'll improve.":"Nice effort. Review the explanations and try again."}function startQuiz(){current=0;score=0;welcome.classList.add("hidden");result.classList.add("hidden");quiz.classList.remove("hidden");showQuestion()}document.getElementById("start").addEventListener("click",startQuiz);document.getElementById("again").addEventListener("click",startQuiz);document.getElementById("next").addEventListener("click",()=>{if(!answered)return;if(current===questions.length-1){finish();return}current++;showQuestion()});</script></body></html>
