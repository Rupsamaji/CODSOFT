name: CareerBoard CI
on:
  push:
    paths:
      - "job-platform/**"
      - ".github/workflows/careerboard-ci.yml"
  pull_request:
    paths:
      - "job-platform/**"
      - ".github/workflows/careerboard-ci.yml"
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode test